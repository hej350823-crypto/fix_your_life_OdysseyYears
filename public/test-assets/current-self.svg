<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Test current self portrait</title>
  <desc id="desc">A soft abstract portrait placeholder for testing the onboarding flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f5f4"/>
      <stop offset="0.5" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="360" cy="300" r="330" fill="url(#glow)"/>
  <ellipse cx="455" cy="520" rx="165" ry="205" fill="#57534e" opacity="0.20" filter="url(#soft)"/>
  <circle cx="450" cy="390" r="118" fill="#292524" opacity="0.28"/>
  <path d="M260 860c34-173 111-256 190-256s156 83 190 256c-84 58-298 58-380 0Z" fill="#292524" opacity="0.30"/>
  <path d="M212 250c72-88 164-132 276-132 108 0 188 40 240 120" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.5"/>
  <text x="450" y="1060" text-anchor="middle" fill="#44403c" font-family="Arial, sans-serif" font-size="38" opacity="0.75">Current Self / 测试照片</text>
</svg>
