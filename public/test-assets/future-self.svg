<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Test future self portrait</title>
  <desc id="desc">A luminous abstract future-self portrait placeholder for testing the final reveal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.52" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#fdba74" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
