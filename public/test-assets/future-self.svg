  <path d="M245 238c48-70 118-120 205-120s157 50 205 120" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
  <text x="450" y="1060" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="38" opacity="0.78">Future Self / 测试结果</text>
